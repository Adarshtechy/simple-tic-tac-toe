<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header class="game-header">
            <h1>Tic Tac Toe</h1>
            <p>A simple strategy game</p>
        </header>


        <!-- Game -->
        <main class="game-container">

            <!-- Board -->
            <section class="game-board">
                <div id="container">
                    <button class="box" id="box1" data-index="0" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box2" data-index="1" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box3" data-index="2" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box4" data-index="3" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box5" data-index="4" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box6" data-index="5" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box7" data-index="6" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box8" data-index="7" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>

                    <button class="box" id="box9" data-index="8" type="button" aria-label="button">
                        <span data-player="none"></span>
                    </button>
                </div>
                <div id="win-line"></div>
            </section>


            <!-- Game Information -->
            <aside class="game-info">

                <!-- Score -->
                <div class="score-board">
                    <div class="player-score player-x">
                        <span>Player X</span>
                        <strong id="score-x">0</strong>
                    </div>

                    <div class="player-score player-o">
                        <span id="player-o-name">Player O</span>
                        <strong id="score-o">0</strong>
                    </div>
                </div>


                <!-- Turn -->
                <div class="current-player">
                    <span class="player-indicator player-x-indicator" id="player-indicator">
                    </span>

                    <span id="turn-indicator">
                        Player X's Turn
                    </span>
                </div>


                <!-- Game Mode -->
                <div class="section-title">
                    Game Mode
                </div>

                <div class="game-mode">
                    <button class="mode-btn active" id="pvp-btn" type="button">
                        Player vs Player
                    </button>

                    <button class="mode-btn" id="ai-btn" type="button">
                        vs Computer
                    </button>
                </div>


                <!-- Difficulty -->
                <div class="difficulty" id="difficulty-container">
                    <label for="ai-difficulty">
                        AI Difficulty
                    </label>

                    <select id="ai-difficulty" class="difficulty-select">
                        <option value="easy">
                            Easy
                        </option>

                        <option value="medium" selected>
                            Medium
                        </option>

                        <option value="hard">
                            Hard
                        </option>
                    </select>
                </div>


                <!-- Thinking -->
                <div class="thinking" id="thinking">
                    Computer is thinking...
                </div>


                <!-- Controls -->
                <div class="controls">
                    <button id="restart-btn" type="button">
                        <i class="fas fa-rotate-right"></i>
                        Restart Game
                    </button>
                </div>


                <!-- History -->
                <div class="history">
                    <h3>Game History</h3>
                    <ul class="history-list" id="history-list">
                        <li>
                            <span>Game started</span>
                            <span>Just now</span>
                        </li>
                    </ul>
                </div>
            </aside>
        </main>


        <!-- Footer -->
        <footer>
            <p>
                © Tic Tac Toe
                <span>•</span>
                Designed with
                <i class="fa-solid fa-heart heart-icon"></i>
            </p>
        </footer>
    </div>


    <!-- Game Result Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="result-modal">
            <div class="result-icon" id="result-icon">
                <i class="fas fa-trophy"></i>
            </div>

            <h2 id="result-title">
                Player X Wins!
            </h2>

            <p id="result-message">
                Congratulations!
            </p>

            <button id="play-again-btn" type="button">
                <i class="fas fa-play"></i>
                Play Again
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
